name: payload-builder
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-verify-idempotent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payload_builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install builder dependencies
        run: python -m pip install rfc8785 pytest
      - name: Test builder authorization boundary
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build payload
        run: python build.py all
      - name: Verify payload
        run: python build.py verify
      - name: Prove byte-identical rebuild
        run: make idempotent
      - name: Install and test extracted control plane
        run: |
          python -m pip install -e dist/extracted/szl-v14
          cd dist/extracted/szl-v14
          python -m pytest -q
