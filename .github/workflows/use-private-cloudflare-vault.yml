name: Use private Cloudflare vault for bounded A11oy edge repair

on:
  push:
    branches:
      - ops/use-private-cloudflare-vault-20260904
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: use-private-cloudflare-vault-${{ github.run_id }}
  cancel-in-progress: false

env:
  A11OY_SHA: 32973f1ac1b82bbb5339df910b28fedd3fa62fd3
  EDGE_REPORT: /tmp/cloudflare-product-edge-v4.json

jobs:
  converge:
    name: Detect private credential and converge exact A11oy Cloudflare edge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact protected A11oy controller source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/a11oy
          ref: ${{ env.A11OY_SHA }}
          path: a11oy
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require private Cloudflare bearer without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo '::error::No supported Cloudflare bearer exists in this private repository production environment.'
            exit 2
          fi
          echo 'A private Cloudflare bearer is available; value remains masked.'

      - name: Prove exact bounded controller and Worker contracts
        working-directory: a11oy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$A11OY_SHA"
          python tests/test_cloudflare_product_edge.py -v
          node --test tests/test_cloudflare_product_edge_worker.mjs
          python -m py_compile scripts/repair_cloudflare_product_edge.py
          node --check cloudflare/a11oy-product-root-worker.mjs

      - name: Deploy Worker, converge exact apex and www state, and prove live routing
        working-directory: a11oy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_cloudflare_product_edge.py --report "$EDGE_REPORT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["EDGE_REPORT"]).read_text(encoding="utf-8"))
          if report.get("status") != "LIVE":
              raise SystemExit(f"Cloudflare convergence ended in {report.get('status')!r}")
          probe = report.get("probe") or {}
          required = {
              "root_verified": probe.get("root_verified") is True,
              "honest_verified": probe.get("honest_verified") is True,
              "www_verified": probe.get("www_verified") is True,
              "token_not_recorded": report.get("token_recorded") is False,
          }
          if not all(required.values()):
              raise SystemExit(f"Cloudflare proof did not close: {required}")
          print(json.dumps({
              "schema": report.get("schema"),
              "status": report.get("status"),
              "zone": report.get("zone"),
              "proof": required,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload secret-free Cloudflare receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-cloudflare-edge-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/cloudflare-product-edge-v4.json
          if-no-files-found: warn
          retention-days: 90
